<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成績レポート</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root { --bg:#f7f6f2; --card:#fff; --line:#e3e0d8; --text:#222; --sub:#777; --ok:#1e7f4f; --ng:#c0392b; --accent:#2b5d8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans JP",sans-serif; font-size:14px; }
  .wrap { max-width:1400px; margin:0 auto; padding:20px 24px 60px; }
  h1 { font-size:18px; font-weight:700; margin:0 0 14px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  button { font-family:inherit; font-size:14px; padding:9px 18px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #status { color:var(--sub); font-size:13px; }
  #report { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px 24px; display:none; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .head .t { font-size:16px; font-weight:700; }
  .head .d { color:var(--sub); font-size:12px; }
  .checks { border:1px solid var(--line); border-radius:6px; padding:10px 14px; margin-bottom:18px; font-size:13px; }
  .checks .row { display:flex; gap:10px; align-items:baseline; padding:3px 0; }
  .checks .badge { flex:none; width:38px; text-align:center; font-weight:700; border-radius:4px; padding:1px 0; font-size:12px; }
  .badge.ok { background:#e5f4ec; color:var(--ok); }
  .badge.ng { background:#fbe9e7; color:var(--ng); }
  .checks .warn { color:var(--ng); font-weight:700; }
  .num { font-family:"JetBrains Mono",monospace; }
  .sheet { margin-bottom:22px; }
  .sheet .label { display:flex; gap:12px; align-items:baseline; margin-bottom:6px; font-size:13px; }
  .sheet .label b { font-size:14px; }
  .sheet .label a { color:var(--accent); font-size:12px; word-break:break-all; }
  .sheet .err { color:var(--ng); font-weight:700; }
  table.gs { border-collapse:collapse; table-layout:fixed; font-family:Arial,"Noto Sans JP",sans-serif; }
  table.gs td { border:1px solid #d9d9d9; padding:0 4px; white-space:nowrap; overflow:hidden; text-overflow:clip; line-height:1.2; }
</style>
</head>
<body>
<div class="wrap">
  <h1>成績レポート（成績管理表 × 勤怠管理）</h1>
  <div class="bar">
    <button class="primary" id="btnFetch">最新を取得</button>
    <button id="btnCopy" disabled>スクショをコピー</button>
    <button id="btnSave" disabled>スクショを保存（PNG）</button>
    <span id="status"></span>
  </div>

  <div id="report">
    <div class="head">
      <div class="t" id="rTitle"></div>
      <div class="d" id="rDate"></div>
    </div>
    <div class="checks" id="checks"></div>
    <div id="sheets"></div>
  </div>
</div>

<script>
// ★ デプロイしたGASのWebアプリURL（…/exec）をここに貼る
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxIxzq_uwiQ5_MEzV6_KHfbrWFpCo4zKG6i0sEq1cXOwwvE00YCbkmysrSYWid2xH1S1g/exec';

const $ = id => document.getElementById(id);
const fmt = n => (n == null ? '—' : Number(n).toLocaleString('ja-JP'));

$('btnFetch').onclick = fetchReport;
$('btnCopy').onclick = () => shot('copy');
$('btnSave').onclick = () => shot('save');

async function fetchReport() {
  $('btnFetch').disabled = true;
  $('status').textContent = '取得中…';
  try {
    const res = await fetch(GAS_URL, { cache: 'no-store' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '不明なエラー');
    render(data);
    $('report').style.display = 'block';
    $('btnCopy').disabled = false;
    $('btnSave').disabled = false;
    $('status').textContent = '取得完了 ' + data.generatedAt;
  } catch (e) {
    $('status').textContent = '取得失敗：' + e.message;
  }
  $('btnFetch').disabled = false;
}

function render(d) {
  $('rTitle').textContent = '成績レポート ' + d.thisMonth.label;
  $('rDate').textContent = '取得 ' + d.generatedAt;

  // ---- チェック ----
  const rows = [];
  const norm = s => String(s || '').replace(/\s/g, '');
  let allOk = true;

  d.seiseki.forEach(s => {
    if (s.error) { rows.push(['ng', `① ${s.name}：${s.error}`]); allOk = false; return; }
    const ok = norm(s.monthLabel) === norm(d.thisMonth.label);
    if (!ok) allOk = false;
    rows.push([ok ? 'ok' : 'ng', `① ${s.name} D1 の年月「${s.monthLabel}」${ok ? '＝ 今月' : '≠ 今月（' + d.thisMonth.label + '）'}`]);
  });
  if (d.kintai.error) { rows.push(['ng', `② ${d.kintai.spreadsheetName}：${d.kintai.error}`]); allOk = false; }
  else if (!d.kintai.salesLabelFound) { rows.push(['ng', `② 「当月売上」のセルが見つかりません`]); allOk = false; }

  const sales = [];
  d.seiseki.forEach(s => { if (!s.error) sales.push({ n: '① ' + s.name + ' ' + s.totalCell, v: s.totalSales }); });
  if (!d.kintai.error && d.kintai.salesLabelFound) sales.push({ n: '② ' + d.kintai.name + ' ' + d.kintai.totalCell, v: d.kintai.totalSales });
  const salesOk = sales.length > 0 && sales.every(x => x.v === sales[0].v);
  if (!salesOk) allOk = false;
  rows.push([salesOk ? 'ok' : 'ng',
    '当月売上 ' + (salesOk ? '一致：' : '不一致：') +
    sales.map(x => `${x.n} <span class="num">${fmt(x.v)}</span>`).join('　/　')]);

  $('checks').innerHTML =
    (allOk ? '' : '<div class="row warn">⚠ 要確認の項目があります</div>') +
    rows.map(r => `<div class="row"><span class="badge ${r[0]}">${r[0] === 'ok' ? 'OK' : 'NG'}</span><span>${r[1]}</span></div>`).join('');

  // ---- 表 ----
  const box = $('sheets');
  box.innerHTML = '';
  d.seiseki.forEach(s => box.appendChild(sheetBlock('① ' + s.spreadsheetName + ' ／ ' + s.name, s)));
  box.appendChild(sheetBlock('② ' + d.kintai.spreadsheetName + ' ／ ' + d.kintai.name, d.kintai));
}

function sheetBlock(title, s) {
  const div = document.createElement('div');
  div.className = 'sheet';
  div.innerHTML = `<div class="label"><b>${esc(title)}</b>${s.url ? `<a href="${s.url}" target="_blank">${s.url}</a>` : ''}</div>`;
  if (s.error) { div.insertAdjacentHTML('beforeend', `<div class="err">${esc(s.error)}</div>`); return div; }
  div.appendChild(buildTable(s));
  return div;
}

function buildTable(s) {
  const skip = Array.from({ length: s.rows }, () => Array(s.cols).fill(false));
  const span = {};
  s.merges.forEach(m => {
    span[m.row + ',' + m.col] = m;
    for (let r = m.row; r < m.row + m.rows; r++)
      for (let c = m.col; c < m.col + m.cols; c++)
        if (r !== m.row || c !== m.col) skip[r][c] = true;
  });
  const t = document.createElement('table');
  t.className = 'gs';
  t.style.width = s.colWidths.reduce((a, b) => a + b, 0) + 'px';
  const cg = document.createElement('colgroup');
  s.colWidths.forEach(w => { const col = document.createElement('col'); col.style.width = w + 'px'; cg.appendChild(col); });
  t.appendChild(cg);
  for (let r = 0; r < s.rows; r++) {
    const tr = document.createElement('tr');
    tr.style.height = s.rowHeights[r] + 'px';
    for (let c = 0; c < s.cols; c++) {
      if (skip[r][c]) continue;
      const td = document.createElement('td');
      const m = span[r + ',' + c];
      if (m) { td.colSpan = m.cols; td.rowSpan = m.rows; }
      td.textContent = s.display[r][c];
      td.style.background = s.backgrounds[r][c];
      td.style.color = s.fontColors[r][c];
      td.style.fontWeight = s.fontWeights[r][c];
      td.style.fontSize = Math.round(s.fontSizes[r][c] * 1.33) + 'px';
      const a = s.hAlign[r][c];
      td.style.textAlign = a === 'general' ? (/^[\d,.\-%¥]+$/.test(s.display[r][c]) ? 'right' : 'left') : a;
      tr.appendChild(td);
    }
    t.appendChild(tr);
  }
  return t;
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

async function shot(mode) {
  $('status').textContent = 'スクショ作成中…';
  try {
    const canvas = await html2canvas($('report'), { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    if (mode === 'copy') {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      $('status').textContent = 'コピーしました。LINEに貼り付けてください（Ctrl+V）';
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '成績レポート_' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '.png';
      a.click();
      $('status').textContent = '保存しました';
    }
  } catch (e) {
    $('status').textContent = 'スクショ失敗：' + e.message;
  }
}
</script>
</body>
</html>
